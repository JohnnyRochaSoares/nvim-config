<svg xmlns="http://www.w3.org/2000/svg" width="77" height="20" role="img" aria-label="License: MIT">
  <title>License: MIT</title>
  <linearGradient id="shade" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
